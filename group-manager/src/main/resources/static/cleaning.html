<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прибирання — 241 група</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
        .header { background: #1a3a5c; color: white; padding: 16px 24px;
                  display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .nav { display: flex; gap: 16px; align-items: center; }
        .nav a { color: white; text-decoration: none; opacity: 0.7; font-size: 14px; }
        .nav a:hover { opacity: 1; }
        .container { max-width: 800px; margin: 24px auto; padding: 0 16px; }
        .controls { background: white; border-radius: 8px; padding: 20px;
                    box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 20px;
                    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .controls input[type=date] { padding: 8px 12px; border: 1px solid #ddd;
                                      border-radius: 4px; font-size: 14px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #1a3a5c; color: white; }
        .btn-primary:hover { background: #15304d; }
        .btn-danger { background: #c62828; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-secondary { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
        .btn-secondary:hover { border-color: #1a3a5c; color: #1a3a5c; }
        .section { background: white; border-radius: 8px; padding: 20px;
                   box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .section h2 { font-size: 16px; margin-bottom: 16px;
                      padding-bottom: 8px; border-bottom: 2px solid #e0e0e0; }
        .platoon-block { margin-bottom: 20px; }
        .platoon-title { font-size: 14px; font-weight: 600; color: #1a3a5c;
                         margin-bottom: 10px; padding: 6px 12px;
                         background: #e8f0fe; border-radius: 4px; }
        .cleaning-item { display: flex; align-items: center; justify-content: space-between;
                         padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
        .cleaning-item:last-child { border-bottom: none; }
        .soldier-name { font-weight: 500; font-size: 14px; }
        .soldier-rank { font-size: 12px; color: #666; margin-top: 2px; }
        .btn-icon { padding: 6px 10px; font-size: 14px; border: 1px solid #ddd;
                    background: #f5f5f5; border-radius: 4px; cursor: pointer; }
        .btn-icon:hover { border-color: #1a3a5c; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .error-msg { background: #ffebee; color: #c62828; padding: 12px;
                     border-radius: 4px; margin-bottom: 12px; font-size: 14px; }
        .success-msg { background: #e8f5e9; color: #2e7d32; padding: 12px;
                       border-radius: 4px; margin-bottom: 12px; font-size: 14px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0;
                         width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
        .modal { background: white; border-radius: 8px; padding: 24px;
                 width: 420px; margin: 10% auto; }
        .modal h3 { margin-bottom: 8px; }
        .candidate-item { display: flex; justify-content: space-between; align-items: center;
                          padding: 10px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .candidate-item:hover { background: #f5f8ff; }
        .candidate-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>Прибирання — 241 навчальна група</h1>
    <nav class="nav">
        <a href="/">Розхід</a>
        <a href="/duties.html">Наряди</a>
        <a href="/cleaning.html">Прибирання</a>
    </nav>
</div>

<div class="container">
    <div class="controls">
        <input type="date" id="dateInput" onchange="loadCleaning()">
        <button class="btn btn-secondary" onclick="loadCleaning()">Переглянути</button>
        <button class="btn btn-primary" onclick="generateCleaning()">+ Згенерувати</button>
        <button class="btn btn-danger" onclick="deleteCleaning()">Видалити</button>
    </div>

    <div id="messageBox"></div>

    <div class="section">
        <h2 id="sectionTitle">Оберіть дату</h2>
        <div id="cleaningList">
            <div class="empty-state">Оберіть дату і натисніть "Переглянути"</div>
        </div>
    </div>
</div>

<!-- Модальне вікно вибору -->
<div class="modal-overlay" id="replaceModal">
    <div class="modal">
        <h3>Замінити солдата</h3>
        <p style="font-size:13px;color:#666;margin-bottom:12px">
            Зараз: <strong id="replaceCurrentName"></strong>
        </p>
        <div id="candidatesList" style="max-height:300px;overflow-y:auto;
             border:1px solid #eee;border-radius:4px;"></div>
        <div style="margin-top:12px;text-align:right">
            <button class="btn btn-secondary" onclick="closeReplaceModal()">Скасувати</button>
        </div>
    </div>
</div>

<script>
    let currentCleaningId = null;
    let currentPlatoon = null;

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;

    function showMessage(text, isError) {
        const box = document.getElementById('messageBox');
        box.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${text}</div>`;
        setTimeout(() => box.innerHTML = '', 4000);
    }

    async function loadCleaning() {
        const date = document.getElementById('dateInput').value;
        if (!date) return;

        const res = await fetch(`/api/cleaning?date=${date}`);
        const cleanings = await res.json();

        const title = document.getElementById('sectionTitle');
        const list = document.getElementById('cleaningList');

        const formatted = new Date(date + 'T00:00:00')
            .toLocaleDateString('uk-UA', {day:'numeric', month:'long', year:'numeric'});
        title.textContent = `Прибирання на ${formatted}`;

        if (cleanings.length === 0) {
            list.innerHTML = '<div class="empty-state">Прибирання не знайдено. Натисніть "Згенерувати"</div>';
            return;
        }

        // Групуємо по відділеннях
        const byPlatoon = {1: [], 2: [], 3: []};
        cleanings.forEach(c => byPlatoon[c.soldier.platoon].push(c));

        list.innerHTML = [1, 2, 3].map(p => `
            <div class="platoon-block">
                <div class="platoon-title">${p} відділення</div>
                ${byPlatoon[p].map(c => `
                    <div class="cleaning-item">
                        <div>
                            <div class="soldier-name">
                                ${c.soldier.lastName} ${c.soldier.firstName} ${c.soldier.middleName}
                                ${c.isManual ? '<span style="font-size:11px;color:#999"> (змінено вручну)</span>' : ''}
                            </div>
                            <div class="soldier-rank">${c.soldier.rank}</div>
                        </div>
                        <button class="btn-icon" title="Замінити"
                            onclick="openReplaceModal(${c.id}, '${c.soldier.lastName} ${c.soldier.firstName}', ${c.soldier.platoon})">🔄</button>
                    </div>`).join('')}
            </div>`).join('');
    }

    async function generateCleaning() {
        const date = document.getElementById('dateInput').value;
        if (!date) { showMessage('Оберіть дату', true); return; }

        const res = await fetch(`/api/cleaning/generate?date=${date}`, { method: 'POST' });
        if (res.ok) {
            showMessage('Прибирання успішно згенеровано!', false);
            loadCleaning();
        } else {
            const text = await res.text();
            showMessage(text, true);
        }
    }

    async function deleteCleaning() {
        const date = document.getElementById('dateInput').value;
        if (!date) return;
        if (!confirm('Видалити прибирання на цю дату?')) return;
        await fetch(`/api/cleaning?date=${date}`, { method: 'DELETE' });
        showMessage('Прибирання видалено', false);
        loadCleaning();
    }

    async function openReplaceModal(cleaningId, currentName, platoon) {
        currentCleaningId = cleaningId;
        currentPlatoon = platoon;
        document.getElementById('replaceCurrentName').textContent = currentName;

        const date = document.getElementById('dateInput').value;

        // Отримати всіх присутніх рядових з цього відділення
        const res = await fetch(`/api/cleaning/${cleaningId}/candidates`);
        const candidates = await res.json();

        const list = document.getElementById('candidatesList');
        if (candidates.length === 0) {
            list.innerHTML = '<div style="padding:16px;text-align:center;color:#999">Немає доступних кандидатів</div>';
        } else {
            list.innerHTML = candidates.map(s => `
                <div class="candidate-item" onclick="confirmReplace(${s.id})">
                    <div>
                        <div style="font-size:14px;font-weight:500">${s.lastName} ${s.firstName} ${s.middleName}</div>
                        <div style="font-size:12px;color:#666">${s.rank}</div>
                    </div>
                </div>`).join('');
        }

        document.getElementById('replaceModal').style.display = 'block';
    }

    async function confirmReplace(soldierId) {
        await fetch(`/api/cleaning/${currentCleaningId}/replace/${soldierId}`, { method: 'PUT' });
        closeReplaceModal();
        loadCleaning();
    }

    function closeReplaceModal() {
        document.getElementById('replaceModal').style.display = 'none';
        currentCleaningId = null;
    }

    loadCleaning();
</script>
</body>
</html>
