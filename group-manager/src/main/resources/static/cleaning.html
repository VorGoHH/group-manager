<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прибирання — 241 н.г.</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }

        nav { background: #16213e; padding: 12px 24px; display: flex; gap: 16px; align-items: center; border-bottom: 1px solid #0f3460; }
        nav a { color: #a0a0c0; text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 6px; transition: background 0.2s; }
        nav a:hover { background: #0f3460; color: #e0e0e0; }
        nav a.active { background: #0f3460; color: #fff; }

        .container { max-width: 860px; margin: 32px auto; padding: 0 16px; }

        .controls { background: #16213e; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .controls input[type=date] { padding: 8px 12px; background: #1e2d4a; border: 1px solid #2a3a5a; border-radius: 6px; font-size: 14px; color: #e0e0e0; }
        .controls input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.7); }

        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.15s; }
        .btn-secondary { background: #1e2d4a; color: #a0b0d0; border: 1px solid #2a3a5a; }
        .btn-secondary:hover { border-color: #5b9bd5; color: #5b9bd5; }
        .btn-primary { background: #1e3a5a; color: #5b9bd5; }
        .btn-primary:hover { background: #254d7a; }
        .btn-danger { background: #3a1e1e; color: #cf6060; }
        .btn-danger:hover { background: #4a2a2a; }

        .section { background: #16213e; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .section-title { font-size: 13px; font-weight: 600; color: #7080a0; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #1e2d4a; }

        .platoon-block { margin-bottom: 20px; }
        .platoon-block:last-child { margin-bottom: 0; }

        .platoon-title { font-size: 13px; font-weight: 600; color: #5b9bd5; margin-bottom: 8px; padding: 6px 10px; background: #1a2a3a; border-radius: 6px; }

        .cleaning-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid #1e2d4a; }
        .cleaning-item:last-child { border-bottom: none; }
        .soldier-name { font-weight: 500; font-size: 14px; color: #fff; }
        .soldier-rank { font-size: 12px; color: #7080a0; margin-top: 2px; }
        .manual-tag { font-size: 11px; color: #4a5a7a; margin-left: 6px; }

        .btn-icon { padding: 6px 10px; font-size: 14px; background: #1e2d4a; border: 1px solid #2a3a5a; border-radius: 6px; cursor: pointer; transition: border-color 0.15s; }
        .btn-icon:hover { border-color: #5b9bd5; }

        .empty-state { text-align: center; padding: 40px; color: #3a4a6a; font-size: 14px; }

        .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .msg.error { background: #3a1e1e; color: #cf6060; }
        .msg.success { background: #1e3a2a; color: #4caf75; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; }
        .modal { background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 24px; width: 420px; margin: 10% auto; }
        .modal h3 { font-size: 16px; color: #fff; margin-bottom: 6px; }
        .modal-sub { font-size: 13px; color: #7080a0; margin-bottom: 14px; }
        .modal-sub strong { color: #a0b0d0; }

        .candidate-list { max-height: 300px; overflow-y: auto; border: 1px solid #1e2d4a; border-radius: 8px; }
        .candidate-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #1e2d4a; cursor: pointer; transition: background 0.15s; }
        .candidate-item:hover { background: #1e2d4a; }
        .candidate-item:last-child { border-bottom: none; }
        .candidate-name { font-size: 14px; font-weight: 500; color: #fff; }
        .candidate-meta { font-size: 12px; color: #7080a0; margin-top: 2px; }

        .modal-footer { margin-top: 14px; text-align: right; }
    </style>
</head>
<body>

<nav>
    <a href="/">Розхід</a>
    <a href="/duties.html">Наряди</a>
    <a href="/cleaning.html" class="active">Прибирання</a>
    <a href="/stats.html">Статистика</a>
</nav>

<div class="container">
    <div class="controls">
        <input type="date" id="dateInput" onchange="loadCleaning()">
        <button class="btn btn-secondary" onclick="loadCleaning()">Переглянути</button>
        <button class="btn btn-primary" onclick="generateCleaning()">+ Згенерувати</button>
        <button class="btn btn-danger" onclick="deleteCleaning()">Видалити</button>
    </div>

    <div id="messageBox"></div>

    <div class="section">
        <div class="section-title" id="sectionTitle">Оберіть дату</div>
        <div id="cleaningList">
            <div class="empty-state">Оберіть дату і натисніть "Переглянути"</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="replaceModal">
    <div class="modal">
        <h3>Замінити солдата</h3>
        <p class="modal-sub">Зараз: <strong id="replaceCurrentName"></strong></p>
        <div class="candidate-list" id="candidatesList"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeReplaceModal()">Скасувати</button>
        </div>
    </div>
</div>

<script>
    let currentCleaningId = null;

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;

    function showMessage(text, isError) {
        const box = document.getElementById('messageBox');
        box.innerHTML = `<div class="msg ${isError ? 'error' : 'success'}">${text}</div>`;
        setTimeout(() => box.innerHTML = '', 4000);
    }

    async function loadCleaning() {
        const date = document.getElementById('dateInput').value;
        if (!date) return;

        const res = await fetch(`/api/cleaning?date=${date}`);
        const cleanings = await res.json();

        const formatted = new Date(date + 'T00:00:00')
            .toLocaleDateString('uk-UA', {day: 'numeric', month: 'long', year: 'numeric'});
        document.getElementById('sectionTitle').textContent = `Прибирання на ${formatted}`;

        const list = document.getElementById('cleaningList');
        if (cleanings.length === 0) {
            list.innerHTML = '<div class="empty-state">Прибирання не знайдено. Натисніть "+ Згенерувати"</div>';
            return;
        }

        const byPlatoon = {1: [], 2: [], 3: []};
        cleanings.forEach(c => byPlatoon[c.soldier.platoon].push(c));

        list.innerHTML = [1, 2, 3].map(p => `
            <div class="platoon-block">
                <div class="platoon-title">${p} відділення</div>
                ${byPlatoon[p].map(c => `
                    <div class="cleaning-item">
                        <div>
                            <div class="soldier-name">
                                ${c.soldier.lastName} ${c.soldier.firstName} ${c.soldier.middleName}
                                ${c.isManual ? '<span class="manual-tag">(змінено вручну)</span>' : ''}
                            </div>
                            <div class="soldier-rank">${c.soldier.rank}</div>
                        </div>
                        <button class="btn-icon" title="Замінити"
                            onclick="openReplaceModal(${c.id}, '${c.soldier.lastName} ${c.soldier.firstName}')">🔄</button>
                    </div>`).join('')}
            </div>`).join('');
    }

    async function generateCleaning() {
        const date = document.getElementById('dateInput').value;
        if (!date) { showMessage('Оберіть дату', true); return; }
        const res = await fetch(`/api/cleaning/generate?date=${date}`, { method: 'POST' });
        if (res.ok) { showMessage('Прибирання успішно згенеровано!', false); loadCleaning(); }
        else { showMessage(await res.text(), true); }
    }

    async function deleteCleaning() {
        const date = document.getElementById('dateInput').value;
        if (!date) return;
        if (!confirm('Видалити прибирання на цю дату?')) return;
        await fetch(`/api/cleaning?date=${date}`, { method: 'DELETE' });
        showMessage('Прибирання видалено', false);
        loadCleaning();
    }

    async function openReplaceModal(cleaningId, currentName) {
        currentCleaningId = cleaningId;
        document.getElementById('replaceCurrentName').textContent = currentName;

        const res = await fetch(`/api/cleaning/${cleaningId}/candidates`);
        const candidates = await res.json();

        const list = document.getElementById('candidatesList');
        if (candidates.length === 0) {
            list.innerHTML = '<div style="padding:16px;text-align:center;color:#4a5a7a">Немає доступних кандидатів</div>';
        } else {
            list.innerHTML = candidates.map(s => `
                <div class="candidate-item" onclick="confirmReplace(${s.id})">
                    <div>
                        <div class="candidate-name">${s.lastName} ${s.firstName} ${s.middleName}</div>
                        <div class="candidate-meta">${s.rank}</div>
                    </div>
                </div>`).join('');
        }

        document.getElementById('replaceModal').style.display = 'block';
    }

    async function confirmReplace(soldierId) {
        await fetch(`/api/cleaning/${currentCleaningId}/replace/${soldierId}`, { method: 'PUT' });
        closeReplaceModal();
        loadCleaning();
    }

    function closeReplaceModal() {
        document.getElementById('replaceModal').style.display = 'none';
        currentCleaningId = null;
    }

    loadCleaning();
</script>
</body>
</html>
