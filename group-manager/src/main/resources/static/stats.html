<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика — 241 н.г.</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }

        nav {
            background: #16213e;
            padding: 12px 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }

        nav a {
            color: #a0a0c0;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        nav a:hover { background: #0f3460; color: #e0e0e0; }
        nav a.active { background: #0f3460; color: #fff; }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 16px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }

        .btn-toggle {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }

        .btn-toggle.view-mode { background: #1e3a5a; color: #7aaddb; }
        .btn-toggle.view-mode:hover { background: #254d7a; }
        .btn-toggle.edit-mode { background: #2a4a1e; color: #7acf8a; }
        .btn-toggle.edit-mode:hover { background: #376328; }

        .edit-hint {
            font-size: 13px;
            color: #5060a0;
            margin-bottom: 20px;
            display: none;
        }
        .edit-hint.visible { display: block; }

        .platoon-section { margin-bottom: 32px; }

        .platoon-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #7080a0;
            margin-bottom: 10px;
            padding-left: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #16213e;
            border-radius: 10px;
            overflow: hidden;
        }

        thead th {
            background: #0f3460;
            padding: 10px 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #a0b0d0;
        }

        tbody tr { border-bottom: 1px solid #1e2d4a; transition: background 0.15s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #1a2640; }

        td { padding: 8px 12px; font-size: 14px; }

        td.name {
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            cursor: pointer;
        }
        td.name:hover { color: #5b9bd5; text-decoration: underline; }

        td.rank { color: #7080a0; font-size: 13px; white-space: nowrap; }

        td.total {
            font-weight: 700;
            color: #5b9bd5;
            text-align: center;
            min-width: 60px;
        }

        .val-view {
            display: block;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-size: 14px;
            padding: 2px 0;
        }
        .val-view.zero { color: #3a4a6a; }

        .cell-counter {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 80px;
        }
        .cell-counter .val {
            min-width: 20px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-size: 14px;
        }
        .cell-counter .val.zero { color: #3a4a6a; }

        body.edit-mode .val-view { display: none; }
        body.edit-mode .cell-counter { display: flex; }

        .btn-adj {
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .btn-adj.plus { background: #1e4a2a; color: #4caf75; }
        .btn-adj.plus:hover { background: #2a6338; }
        .btn-adj.minus { background: #4a1e1e; color: #cf6060; }
        .btn-adj.minus:hover { background: #633030; }
        .btn-adj:disabled { opacity: 0.3; cursor: not-allowed; }

        .loading { text-align: center; padding: 60px; color: #5060a0; font-size: 15px; }
        .error { text-align: center; padding: 40px; color: #c0504a; }

        /* Модалка історії */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 100;
        }

        .modal {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 24px;
            width: 560px;
            max-width: 95vw;
            margin: 6% auto;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h2 { font-size: 17px; color: #fff; }

        .modal-close {
            background: none;
            border: none;
            color: #7080a0;
            font-size: 20px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }
        .modal-close:hover { color: #fff; }

        .modal-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            padding: 6px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            background: #1e2d4a;
            color: #7080a0;
            transition: all 0.15s;
        }
        .tab-btn.active { background: #0f3460; color: #fff; }

        .modal-body { overflow-y: auto; flex: 1; }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 4px;
            border-bottom: 1px solid #1e2d4a;
            font-size: 14px;
        }
        .history-item:last-child { border-bottom: none; }

        .history-date { color: #7080a0; font-size: 13px; min-width: 160px; }
        .history-role { color: #e0e0e0; }
        .history-manual { font-size: 11px; color: #4a5a7a; margin-left: 6px; }
        .history-empty { text-align: center; padding: 30px; color: #3a4a6a; font-size: 14px; }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px; right: 24px;
            background: #1e3a2a;
            color: #4caf75;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        #toast.err { background: #3a1e1e; color: #cf6060; }
        #toast.show { opacity: 1; }


    </style>
</head>
<body>

<nav>
    <a href="/">Розхід</a>
    <a href="/duties.html">Наряди</a>
    <a href="/cleaning.html">Прибирання</a>
    <a href="/stats.html" class="active">Статистика</a>
</nav>

<div class="container">
    <div class="page-header">
        <h1>Статистика нарядів і прибирань</h1>
        <button class="btn-toggle view-mode" id="toggleBtn" onclick="toggleMode()">✏️ Редагувати</button>
    </div>
    <p class="edit-hint" id="editHint">Натисніть + / − щоб відкоригувати кількість вручну</p>

    <div id="content">
        <div class="loading">Завантаження...</div>
    </div>
</div>

<!-- Модалка історії -->
<div class="modal-overlay" id="historyModal" onclick="if(event.target===this)closeHistory()">
    <div class="modal">
        <div class="modal-header">
            <h2 id="historyTitle"></h2>
            <button class="modal-close" onclick="closeHistory()">✕</button>
        </div>
        <div class="modal-tabs">
            <button class="tab-btn active" id="tabDuties" onclick="switchTab('duties')">Наряди</button>
            <button class="tab-btn" id="tabCleanings" onclick="switchTab('cleanings')">Прибирання</button>
        </div>
        <div class="modal-body" id="historyBody"></div>
    </div>
</div>

<div id="toast"></div>

<script>
    const PLATOON_LABELS = { 1: '1 відділення', 2: '2 відділення', 3: '3 відділення' };
    const ROLES = ['Черговий ПУ', 'Помічник ЧПУ', 'Днювальний', 'Їдальня'];
    const ROLE_SHORT = {
        'Черговий ПУ': 'Черг. ПУ',
        'Помічник ЧПУ': 'Пом. ЧПУ',
        'Днювальний': 'Днюв.',
        'Їдальня': 'Їдальня'
    };

    let editMode = false;
    let currentTab = 'duties';
    let historyData = {};

    function toggleMode() {
        editMode = !editMode;
        const btn = document.getElementById('toggleBtn');
        const hint = document.getElementById('editHint');
        if (editMode) {
            document.body.classList.add('edit-mode');
            btn.textContent = '👁 Перегляд';
            btn.className = 'btn-toggle edit-mode';
            hint.classList.add('visible');
        } else {
            document.body.classList.remove('edit-mode');
            btn.textContent = '✏️ Редагувати';
            btn.className = 'btn-toggle view-mode';
            hint.classList.remove('visible');
        }
    }

    async function load() {
        try {
            const res = await fetch('/api/stats');
            if (!res.ok) throw new Error('Помилка сервера');
            const data = await res.json();
            render(data);
        } catch (e) {
            document.getElementById('content').innerHTML =
                `<div class="error">Помилка завантаження: ${e.message}</div>`;
        }
    }

    function render(data) {
        const byPlatoon = {};
        for (const row of data) {
            const p = row.platoon;
            if (!byPlatoon[p]) byPlatoon[p] = [];
            byPlatoon[p].push(row);
        }

        let html = '';

        for (const platoon of [1, 2, 3]) {
            const soldiers = byPlatoon[platoon] || [];
            if (!soldiers.length) continue;

            const roleHeaders = ROLES.map(r => `<th>${ROLE_SHORT[r]}</th>`).join('');

            html += `
                <div class="platoon-section">
                    <div class="platoon-title">${PLATOON_LABELS[platoon]}</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Прізвище</th>
                                <th>Звання</th>
                                ${roleHeaders}
                                <th>Всього нарядів</th>
                                <th>Прибирань</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            for (const s of soldiers) {
                const roleCells = ROLES.map(role => {
                    const val = s.dutyByRole[role] || 0;
                    const enc = encodeURIComponent(role);
                    return `
                        <td>
                            <span class="val-view ${val === 0 ? 'zero' : ''}" id="view-duty-${s.id}-${enc}">${val}</span>
                            <div class="cell-counter">
                                <button class="btn-adj minus" onclick="adjustDuty(${s.id}, '${enc}', -1, this)" ${val === 0 ? 'disabled' : ''}>−</button>
                                <span class="val ${val === 0 ? 'zero' : ''}" id="duty-${s.id}-${enc}">${val}</span>
                                <button class="btn-adj plus" onclick="adjustDuty(${s.id}, '${enc}', 1, this)">+</button>
                            </div>
                        </td>
                    `;
                }).join('');

                const cleanVal = s.totalCleaning || 0;
                const cleanCell = `
                    <td>
                        <span class="val-view ${cleanVal === 0 ? 'zero' : ''}" id="view-clean-${s.id}">${cleanVal}</span>
                        <div class="cell-counter">
                            <button class="btn-adj minus" onclick="adjustCleaning(${s.id}, -1, this)" ${cleanVal === 0 ? 'disabled' : ''}>−</button>
                            <span class="val ${cleanVal === 0 ? 'zero' : ''}" id="clean-${s.id}">${cleanVal}</span>
                            <button class="btn-adj plus" onclick="adjustCleaning(${s.id}, 1, this)">+</button>
                        </div>
                    </td>
                `;

                html += `
                    <tr>
                        <td class="name" onclick="openHistory(${s.id}, '${s.lastName} ${s.firstName[0]}.')" title="Переглянути історію">${s.lastName} ${s.firstName[0]}.</td>
                        <td class="rank">${s.rank}</td>
                        ${roleCells}
                        <td class="total" id="total-${s.id}">${s.totalDuty}</td>
                        ${cleanCell}
                    </tr>
                `;
            }

            html += `</tbody></table></div>`;
        }

        document.getElementById('content').innerHTML = html || '<div class="loading">Немає даних</div>';
    }

    // ── Історія ──────────────────────────────────────────

    async function openHistory(soldierId, name) {
        document.getElementById('historyTitle').textContent = name;
        document.getElementById('historyBody').innerHTML = '<div class="history-empty">Завантаження...</div>';
        document.getElementById('historyModal').style.display = 'block';

        const res = await fetch(`/api/stats/${soldierId}/history`);
        if (!res.ok) {
            document.getElementById('historyBody').innerHTML = '<div class="history-empty">Помилка завантаження</div>';
            return;
        }
        historyData = await res.json();
        currentTab = 'duties';
        document.getElementById('tabDuties').className = 'tab-btn active';
        document.getElementById('tabCleanings').className = 'tab-btn';
        renderHistoryTab();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabDuties').className = 'tab-btn' + (tab === 'duties' ? ' active' : '');
        document.getElementById('tabCleanings').className = 'tab-btn' + (tab === 'cleanings' ? ' active' : '');
        renderHistoryTab();
    }

    function renderHistoryTab() {
        const body = document.getElementById('historyBody');
        const items = currentTab === 'duties' ? historyData.duties : historyData.cleanings;

        if (!items || items.length === 0) {
            body.innerHTML = '<div class="history-empty">Немає записів</div>';
            return;
        }

        if (currentTab === 'duties') {
            body.innerHTML = items.map(d => {
                const date = d.date === '1970-01-01'
                    ? 'ручне коригування'
                    : new Date(d.date + 'T00:00:00').toLocaleDateString('uk-UA', {day: 'numeric', month: 'long', year: 'numeric'});
                return `
                    <div class="history-item">
                        <span class="history-date">${date}</span>
                        <span class="history-role">${d.role}${d.isManual ? '<span class="history-manual">(вручну)</span>' : ''}</span>
                    </div>`;
            }).join('');
        } else {
            body.innerHTML = items.map(c => {
                const date = c.date === '1970-01-01'
                    ? 'ручне коригування'
                    : new Date(c.date + 'T00:00:00').toLocaleDateString('uk-UA', {day: 'numeric', month: 'long', year: 'numeric'});
                return `
                    <div class="history-item">
                        <span class="history-date">${date}</span>
                        <span class="history-role">${c.territory}${c.isManual ? '<span class="history-manual">(вручну)</span>' : ''}</span>
                    </div>`;
            }).join('');
        }
    }

    function closeHistory() {
        document.getElementById('historyModal').style.display = 'none';
        historyData = {};
    }

    // ── Редагування ──────────────────────────────────────

    async function adjustDuty(soldierId, roleEnc, delta, btn) {
        const method = delta > 0 ? 'POST' : 'DELETE';
        setLoading(btn, true);
        try {
            const res = await fetch(`/api/stats/${soldierId}/duty?role=${roleEnc}`, { method });
            if (!res.ok) throw new Error(await res.text());

            const newVal = updateVal(`duty-${soldierId}-${roleEnc}`, delta);
            updateVal(`view-duty-${soldierId}-${roleEnc}`, delta);

            const totalEl = document.getElementById(`total-${soldierId}`);
            totalEl.textContent = parseInt(totalEl.textContent) + delta;

            btn.parentElement.querySelector('.minus').disabled = newVal === 0;
            showToast(delta > 0 ? 'Додано' : 'Видалено');
        } catch (e) {
            showToast(e.message, true);
        } finally {
            setLoading(btn, false);
        }
    }

    async function adjustCleaning(soldierId, delta, btn) {
        const method = delta > 0 ? 'POST' : 'DELETE';
        setLoading(btn, true);
        try {
            const res = await fetch(`/api/stats/${soldierId}/cleaning`, { method });
            if (!res.ok) throw new Error(await res.text());

            const newVal = updateVal(`clean-${soldierId}`, delta);
            updateVal(`view-clean-${soldierId}`, delta);

            btn.parentElement.querySelector('.minus').disabled = newVal === 0;
            showToast(delta > 0 ? 'Додано' : 'Видалено');
        } catch (e) {
            showToast(e.message, true);
        } finally {
            setLoading(btn, false);
        }
    }

    function updateVal(id, delta) {
        const el = document.getElementById(id);
        const newVal = parseInt(el.textContent) + delta;
        el.textContent = newVal;
        el.className = el.className.replace(/\bzero\b/, '').trim();
        if (newVal === 0) el.className += ' zero';
        return newVal;
    }

    function setLoading(btn, loading) { btn.disabled = loading; }

    let toastTimer;
    function showToast(msg, isErr = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = isErr ? 'err show' : 'show';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.className = ''; }, 2000);
    }

    load();
</script>

</body>
</html>
