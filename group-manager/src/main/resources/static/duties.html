<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наряди — 241 група</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
        .header { background: #1a3a5c; color: white; padding: 16px 24px;
                  display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .nav { display: flex; gap: 16px; }
        .nav a { color: white; text-decoration: none; opacity: 0.7; font-size: 14px; }
        .nav a:hover { opacity: 1; }
        .container { max-width: 800px; margin: 24px auto; padding: 0 16px; }
        .controls { background: white; border-radius: 8px; padding: 20px;
                    box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 20px;
                    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .controls input[type=date] { padding: 8px 12px; border: 1px solid #ddd;
                                      border-radius: 4px; font-size: 14px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px;
               cursor: pointer; font-size: 14px; }
        .btn-primary { background: #1a3a5c; color: white; }
        .btn-primary:hover { background: #15304d; }
        .btn-danger { background: #c62828; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-secondary { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
        .btn-secondary:hover { border-color: #1a3a5c; color: #1a3a5c; }
        .section { background: white; border-radius: 8px; padding: 20px;
                   box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .section h2 { font-size: 16px; margin-bottom: 16px;
                      padding-bottom: 8px; border-bottom: 2px solid #e0e0e0; }
        .duty-item { display: flex; align-items: center; padding: 12px;
                     border-bottom: 1px solid #f0f0f0; gap: 12px; }
        .duty-item:last-child { border-bottom: none; }
        .role-badge { font-size: 12px; padding: 3px 10px; border-radius: 12px;
                      font-weight: 500; min-width: 120px; text-align: center; }
        .role-1 { background: #fff3e0; color: #e65100; }
        .role-2 { background: #e8f5e9; color: #2e7d32; }
        .role-3 { background: #e3f2fd; color: #1565c0; }
        .role-4 { background: #f3e5f5; color: #6a1b9a; }
        .soldier-name { font-weight: 500; font-size: 15px; }
        .soldier-rank { font-size: 12px; color: #666; margin-top: 2px; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .error-msg { background: #ffebee; color: #c62828; padding: 12px;
                     border-radius: 4px; margin-bottom: 12px; font-size: 14px; }
        .success-msg { background: #e8f5e9; color: #2e7d32; padding: 12px;
                       border-radius: 4px; margin-bottom: 12px; font-size: 14px; }
        .btn-icon { padding: 6px 10px; font-size: 14px; border: 1px solid #ddd;
                    background: #f5f5f5; border-radius: 4px; cursor: pointer; }
        .btn-icon:hover { border-color: #1a3a5c; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0;
                         width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
        .modal { background: white; border-radius: 8px; padding: 24px;
                 width: 420px; margin: 10% auto; }
        .modal h3 { margin-bottom: 8px; }
        .candidate-item { display: flex; justify-content: space-between; align-items: center;
                          padding: 10px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .candidate-item:hover { background: #f5f8ff; }
        .candidate-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>Наряди — 241 навчальна група</h1>
    <nav class="nav">
        <a href="/">Розхід</a>
        <a href="/duties.html">Наряди</a>
    </nav>
</div>

<div class="container">
    <div class="controls">
        <input type="date" id="dateInput" onchange="loadDuty()">
        <button class="btn btn-secondary" onclick="loadDuty()">Переглянути</button>
        <button class="btn btn-primary" onclick="generateDuty('NORMAL')">+ Звичайний наряд</button>
        <button class="btn btn-primary" onclick="generateDuty('WITH_PU')">+ Наряд з ПУ</button>
        <button class="btn btn-danger" onclick="deleteDuty()">Видалити</button>
    </div>

    <div id="messageBox"></div>

    <div class="section">
        <h2 id="sectionTitle">Оберіть дату</h2>
        <div id="dutyList">
            <div class="empty-state">Оберіть дату і натисніть "Переглянути"</div>
        </div>
    </div>
</div>

<!-- Модальне вікно вибору -->
<div class="modal-overlay" id="replaceModal">
    <div class="modal">
        <h3>Замінити — <span id="replaceRoleName"></span></h3>
        <p style="font-size:13px;color:#666;margin-bottom:12px">
            Зараз: <strong id="replaceCurrentName"></strong>
        </p>
        <div id="candidatesList" style="max-height:300px;overflow-y:auto;
             border:1px solid #eee;border-radius:4px;"></div>
        <div style="margin-top:12px;text-align:right">
            <button class="btn btn-secondary" onclick="closeReplaceModal()">Скасувати</button>
        </div>
    </div>
</div>

<script>
    const ROLE_COLORS = { 1: 'role-1', 2: 'role-2', 3: 'role-3', 4: 'role-4' };
    let currentDutyId = null;

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateInput').value = today;

    function showMessage(text, isError) {
        const box = document.getElementById('messageBox');
        box.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${text}</div>`;
        setTimeout(() => box.innerHTML = '', 4000);
    }

    async function loadDuty() {
        const date = document.getElementById('dateInput').value;
        if (!date) return;

        const res = await fetch(`/api/duties?date=${date}`);
        const duties = await res.json();

        const title = document.getElementById('sectionTitle');
        const list = document.getElementById('dutyList');

        const formatted = new Date(date + 'T00:00:00')
            .toLocaleDateString('uk-UA', {day:'numeric', month:'long', year:'numeric'});
        title.textContent = `Наряд на ${formatted}`;

        if (duties.length === 0) {
            list.innerHTML = '<div class="empty-state">Наряд не знайдено. Натисніть "Згенерувати наряд"</div>';
            return;
        }

        list.innerHTML = duties.map(d => `
            <div class="duty-item">
                <span class="role-badge ${ROLE_COLORS[d.role.id]}">${d.role.name}</span>
                <div style="flex:1">
                    <div class="soldier-name">
                        ${d.soldier.lastName} ${d.soldier.firstName} ${d.soldier.middleName}
                        ${d.isManual ? '<span style="font-size:11px;color:#999"> (змінено вручну)</span>' : ''}
                    </div>
                    <div class="soldier-rank">${d.soldier.rank} · ${d.soldier.platoon} відділення</div>
                </div>
                <div style="display:flex;gap:6px">
                    <button class="btn-icon" title="Вибрати вручну"
                        onclick="openReplaceModal(${d.id}, '${d.soldier.lastName} ${d.soldier.firstName}', '${d.role.name}')">🔄</button>
                    <button class="btn-icon" title="Замінити випадково"
                        onclick="replaceRandom(${d.id})">🎲</button>
                </div>
            </div>`).join('');
    }

    async function generateDuty(type) {
        const date = document.getElementById('dateInput').value;
        if (!date) { showMessage('Оберіть дату', true); return; }

        const res = await fetch(`/api/duties/generate?date=${date}&type=${type}`, { method: 'POST' });
        if (res.ok) {
            showMessage('Наряд успішно згенеровано!', false);
            loadDuty();
        } else {
            const text = await res.text();
            showMessage(text, true);
        }
    }

    async function deleteDuty() {
        const date = document.getElementById('dateInput').value;
        if (!date) return;
        if (!confirm('Видалити наряд на цю дату?')) return;
        await fetch(`/api/duties?date=${date}`, { method: 'DELETE' });
        showMessage('Наряд видалено', false);
        loadDuty();
    }

    // Відкрити модалку з вибором кандидата
    async function openReplaceModal(dutyId, currentName, roleName) {
        currentDutyId = dutyId;
        document.getElementById('replaceRoleName').textContent = roleName;
        document.getElementById('replaceCurrentName').textContent = currentName;

        const res = await fetch(`/api/duties/${dutyId}/candidates`);
        const candidates = await res.json();

        const list = document.getElementById('candidatesList');
        if (candidates.length === 0) {
            list.innerHTML = '<div style="padding:16px;text-align:center;color:#999">Немає доступних кандидатів</div>';
        } else {
            list.innerHTML = candidates.map(s => `
                <div class="candidate-item" onclick="confirmReplace(${s.id})">
                    <div>
                        <div style="font-size:14px;font-weight:500">${s.lastName} ${s.firstName} ${s.middleName}</div>
                        <div style="font-size:12px;color:#666">${s.rank} · ${s.platoon} відділення</div>
                    </div>
                </div>`).join('');
        }

        document.getElementById('replaceModal').style.display = 'block';
    }

    async function confirmReplace(soldierId) {
        await fetch(`/api/duties/${currentDutyId}/replace/${soldierId}`, { method: 'PUT' });
        closeReplaceModal();
        loadDuty();
    }

    function closeReplaceModal() {
        document.getElementById('replaceModal').style.display = 'none';
        currentDutyId = null;
    }

    // Замінити випадково
    async function replaceRandom(dutyId) {
        const res = await fetch(`/api/duties/${dutyId}/replace`, { method: 'PUT' });
        if (res.ok) {
            loadDuty();
        } else {
            const text = await res.text();
            showMessage(text, true);
        }
    }

    loadDuty();
</script>
</body>
</html>
