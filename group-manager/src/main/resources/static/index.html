<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розхід — 241 н.г.</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }

        nav { background: #16213e; padding: 12px 24px; display: flex; gap: 16px; align-items: center; border-bottom: 1px solid #0f3460; }
        nav a { color: #a0a0c0; text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 6px; transition: background 0.2s; }
        nav a:hover { background: #0f3460; color: #e0e0e0; }
        nav a.active { background: #0f3460; color: #fff; }

        .container { max-width: 1100px; margin: 32px auto; padding: 0 16px; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #16213e; border-radius: 10px; padding: 24px; text-align: center; }
        .stat-card .number { font-size: 42px; font-weight: 700; line-height: 1; }
        .stat-card .label { font-size: 13px; color: #7080a0; margin-top: 6px; }
        .stat-card.total .number   { color: #5b9bd5; }
        .stat-card.present .number { color: #4caf75; }
        .stat-card.absent .number  { color: #cf6060; }

        .section { background: #16213e; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .section-title { font-size: 13px; font-weight: 600; color: #7080a0; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #1e2d4a; }

        .soldiers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .soldier-card { background: #1e2d4a; border: 1px solid #1e2d4a; border-radius: 8px; padding: 10px 14px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
        .soldier-card:hover { background: #253a5e; border-color: #3a5a8a; }
        .soldier-card .name { font-size: 14px; font-weight: 500; color: #fff; }
        .soldier-card .rank { font-size: 12px; color: #7080a0; margin-top: 2px; }
        .soldier-card .platoon { font-size: 11px; color: #4a5a7a; margin-top: 2px; }

        .absence-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid #1e2d4a; }
        .absence-item:last-child { border-bottom: none; }
        .absence-item strong { font-size: 14px; color: #fff; }

        .reason-badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 500; margin-left: 8px; }
        .SICK          { background: #3a1a1a; color: #cf6060; }
        .EXCUSED       { background: #1a3a2a; color: #4caf75; }
        .BUSINESS_TRIP { background: #1a2a3a; color: #5b9bd5; }
        .INDIVIDUAL    { background: #2a1a3a; color: #a06ad5; }
        .ILLEGAL       { background: #3a1a1a; color: #e06060; }
        .ON_DUTY       { background: #3a2a1a; color: #d5955b; }

        .note-text { font-size: 12px; color: #5060a0; margin-left: 6px; }

        .btn-return { background: none; border: 1px solid #2a3a5a; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12px; color: #7080a0; transition: border-color 0.15s, color 0.15s; }
        .btn-return:hover { border-color: #5b9bd5; color: #5b9bd5; }

        .empty-state { text-align: center; padding: 30px; color: #3a4a6a; font-size: 14px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; }
        .modal { background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 24px; width: 360px; margin: 15% auto; }
        .modal h3 { font-size: 16px; color: #fff; margin-bottom: 16px; }
        .modal select, .modal input { width: 100%; padding: 9px 12px; margin-bottom: 12px; background: #1e2d4a; border: 1px solid #2a3a5a; border-radius: 6px; font-size: 14px; color: #e0e0e0; }
        .modal select option { background: #16213e; }
        .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

        .btn-primary { background: #1e3a5a; color: #5b9bd5; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.15s; }
        .btn-primary:hover { background: #254d7a; }
        .btn-cancel { background: #1e2d4a; color: #7080a0; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.15s; }
        .btn-cancel:hover { background: #253a5e; }

        .btn-history { background: none; border: 1px solid #2a3a5a; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; color: #7080a0; transition: border-color 0.15s, color 0.15s; }
.btn-history:hover { border-color: #5b9bd5; color: #5b9bd5; }

.history-modal { background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 24px; width: 500px; max-width: 95vw; margin: 8% auto; max-height: 78vh; display: flex; flex-direction: column; }
.history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.history-header h3 { font-size: 16px; color: #fff; }
.modal-close { background: none; border: none; color: #7080a0; font-size: 20px; cursor: pointer; }
.modal-close:hover { color: #fff; }
.history-body { overflow-y: auto; flex: 1; }
.history-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 4px; border-bottom: 1px solid #1e2d4a; font-size: 14px; }
.history-item:last-child { border-bottom: none; }
.history-date { color: #7080a0; font-size: 13px; min-width: 150px; }
.history-note { font-size: 12px; color: #4a5a7a; margin-top: 2px; }
.history-empty { text-align: center; padding: 30px; color: #3a4a6a; font-size: 14px; }

    </style>
</head>
<body>

<nav>
    <a href="/" class="active">Розхід</a>
    <a href="/duties.html">Наряди</a>
    <a href="/cleaning.html">Прибирання</a>
    <a href="/stats.html">Статистика</a>
</nav>

<div class="container">
    <div class="stats-row">
        <div class="stat-card total"><div class="number" id="totalCount">—</div><div class="label">За списком</div></div>
        <div class="stat-card present"><div class="number" id="presentCount">—</div><div class="label">В наявності</div></div>
        <div class="stat-card absent"><div class="number" id="absentCount">—</div><div class="label">Відсутні</div></div>
    </div>

    <div class="section">
        <div class="section-title">Особовий склад — клікни щоб відмітити відсутнім</div>
        <div class="soldiers-grid" id="soldiersGrid"></div>
    </div>

    <div class="section">
        <div class="section-title">Відсутні</div>
        <div id="absencesList"><div class="empty-state">Всі присутні</div></div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3 id="modalTitle">Відмітити відсутнім</h3>
        <select id="reasonSelect">
            <option value="SICK">Хворий</option>
            <option value="EXCUSED">Звільнення</option>
            <option value="BUSINESS_TRIP">Відрядження</option>
            <option value="INDIVIDUAL">Індивідуальні заняття</option>
            <option value="ILLEGAL">Незаконно відсутній</option>
            <option value="ON_DUTY">Наряд</option>
        </select>
        <input type="text" id="noteInput" placeholder="Примітка (необов'язково)">
        <div class="modal-buttons">
            <button class="btn-history" onclick="openHistory()">📋 Історія</button>
            <div style="display:flex;gap:8px">
                <button class="btn-cancel" onclick="closeModal()">Скасувати</button>
                <button class="btn-primary" onclick="confirmAbsent()">Підтвердити</button>
        </div>
    </div>
</div>
</div>
    <div class="modal-overlay" id="historyOverlay" onclick="if(event.target===this)closeHistory()">
        <div class="history-modal">
            <div class="history-header">
                <h3 id="historyTitle"></h3>
                <button class="modal-close" onclick="closeHistory()">✕</button>
            </div>
            <div class="history-body" id="historyBody"></div>
        </div>
    </div>
<script>

    const REASON_LABELS = {
        SICK: 'Хворий', EXCUSED: 'Звільнення', BUSINESS_TRIP: 'Відрядження',
        INDIVIDUAL: 'І/з', ILLEGAL: 'Н/в', ON_DUTY: 'Наряд'
    };

    let selectedSoldierId = null;
    let selectedSoldierName = null;
    const today = new Date().toISOString().split('T')[0];

    async function loadAttendance() {
        const res = await fetch(`/api/attendance?date=${today}`);
        const data = await res.json();

        document.getElementById('totalCount').textContent = data.total;
        document.getElementById('presentCount').textContent = data.presentCount;
        document.getElementById('absentCount').textContent = data.absences.length;

        const grid = document.getElementById('soldiersGrid');
        grid.innerHTML = '';
        data.present.forEach(s => {
            const card = document.createElement('div');
            card.className = 'soldier-card';
            card.innerHTML = `
                <div class="name">${s.lastName} ${s.firstName}</div>
                <div class="rank">${s.rank}</div>
                <div class="platoon">${s.platoon} відділення</div>`;
            card.onclick = () => openModal(s.id, s.lastName + ' ' + s.firstName);
            grid.appendChild(card);
        });

        const list = document.getElementById('absencesList');
        if (data.absences.length === 0) {
            list.innerHTML = '<div class="empty-state">Всі присутні</div>';
        } else {
            list.innerHTML = data.absences.map(a => `
                <div class="absence-item">
                    <div>
                        <strong>${a.soldier.lastName} ${a.soldier.firstName}</strong>
                        <span class="reason-badge ${a.reason}">${REASON_LABELS[a.reason]}</span>
                        ${a.note ? `<span class="note-text">— ${a.note}</span>` : ''}
                    </div>
                    <button class="btn-return" onclick="markPresent(${a.soldier.id})">Повернути</button>
                </div>`).join('');
        }
    }

    function openModal(id, name) {
        selectedSoldierId = id;
        selectedSoldierName = name;
        document.getElementById('modalTitle').textContent = name;
        document.getElementById('noteInput').value = '';
        document.getElementById('modalOverlay').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        selectedSoldierId = null;
    }

    async function confirmAbsent() {
        const reason = document.getElementById('reasonSelect').value;
        const note = document.getElementById('noteInput').value;
        await fetch('/api/attendance/absent', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({soldierId: selectedSoldierId, date: today, reason, note})
        });
        closeModal();
        loadAttendance();
    }

    async function markPresent(soldierId) {
        await fetch(`/api/attendance/absent/${soldierId}?date=${today}`, {method: 'DELETE'});
        loadAttendance();
    }
async function openHistory() {
    document.getElementById('historyTitle').textContent = selectedSoldierName;
    document.getElementById('historyBody').innerHTML = '<div class="history-empty">Завантаження...</div>';
    document.getElementById('historyOverlay').style.display = 'block';

    const res = await fetch(`/api/attendance/${selectedSoldierId}/history`);
    if (!res.ok) {
        document.getElementById('historyBody').innerHTML = '<div class="history-empty">Помилка завантаження</div>';
        return;
    }
    const absences = await res.json();

    if (absences.length === 0) {
        document.getElementById('historyBody').innerHTML = '<div class="history-empty">Відсутностей не зафіксовано</div>';
        return;
    }

    document.getElementById('historyBody').innerHTML = absences.map(a => {
        const date = new Date(a.absenceDate + 'T00:00:00')
            .toLocaleDateString('uk-UA', {day: 'numeric', month: 'long', year: 'numeric'});
        return `
            <div class="history-item">
                <span class="history-date">${date}</span>
                <div>
                    <span class="reason-badge ${a.reason}">${REASON_LABELS[a.reason]}</span>
                    ${a.note ? `<div class="history-note">${a.note}</div>` : ''}
                </div>
            </div>`;
    }).join('');
}

function closeHistory() {
    document.getElementById('historyOverlay').style.display = 'none';
}
    loadAttendance();
</script>
</body>
</html>
